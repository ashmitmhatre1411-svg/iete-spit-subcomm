<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join IETE SPIT</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(5, 12, 28, 0.94),
                    rgba(5, 12, 28, 0.97)
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(0, 150, 255, 0.08) 40px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(0, 150, 255, 0.08) 40px
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* Background glow */

        body::before {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            background: rgba(0, 140, 255, 0.15);

            filter: blur(120px);

            border-radius: 50%;

            top: -150px;
            left: -150px;
        }

        body::after {
            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            background: rgba(0, 100, 255, 0.12);

            filter: blur(120px);

            border-radius: 50%;

            bottom: -180px;
            right: -150px;
        }

        /* Main card */

        .container {
            width: min(90%, 650px);

            padding: 45px 35px;

            background: rgba(8, 20, 42, 0.82);

            border: 1px solid rgba(0, 153, 255, 0.35);

            border-radius: 25px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 0 40px rgba(0, 140, 255, 0.12),
                inset 0 0 30px rgba(0, 120, 255, 0.03);

            text-align: center;

            position: relative;

            z-index: 10;
        }

        /* Logo */

        .logo {
            width: 120px;
            height: 120px;

            object-fit: contain;

            margin-bottom: 20px;

            filter:
                drop-shadow(
                    0 0 10px rgba(0, 170, 255, 0.65)
                )
                drop-shadow(
                    0 0 25px rgba(0, 120, 255, 0.3)
                );
        }

        /* Tag */

        .tag {
            color: #58bfff;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 18px;
        }

        /* Heading */

        h1 {
            font-size: clamp(45px, 9vw, 75px);

            font-weight: 800;

            letter-spacing: 5px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #6cc8ff,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 15px;
        }

        /* Subtitle */

        .subtitle {
            color: #a9bad3;

            font-size: 16px;

            line-height: 1.7;

            max-width: 500px;

            margin: 0 auto 30px;
        }

        /* Question */

        .question {
            font-size: 20px;

            font-weight: 600;

            color: #eaf4ff;

            margin-bottom: 25px;
        }

        /* Buttons */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;
        }

        button {
            width: 145px;
            height: 52px;

            border-radius: 12px;

            border: none;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        /* YES */

        #yesBtn {
            color: white;

            background: linear-gradient(
                135deg,
                #007bff,
                #00a6ff
            );

            box-shadow:
                0 0 15px rgba(0, 150, 255, 0.35);
        }

        #yesBtn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 25px rgba(0, 160, 255, 0.65);
        }

        /* NO */

        #noBtn {
            color: #d7e2f5;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(150, 190, 240, 0.25);
        }

        #noBtn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Disabled NO button */

        #noBtn:disabled {
            cursor: not-allowed;

            opacity: 0.5;

            background: rgba(255, 255, 255, 0.05);

            box-shadow: none;
        }

        /* Footer */

        .footer {
            margin-top: 35px;

            font-size: 10px;

            letter-spacing: 1.5px;

            color: #667c9c;

            line-height: 1.6;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                width: 92%;

                padding: 35px 18px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            .tag {
                font-size: 9px;

                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 14px;
            }

            .question {
                font-size: 17px;
            }

            button {
                width: 125px;

                height: 48px;

                font-size: 13px;
            }

            .footer {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- IETE LOGO -->

        <img
            src="iete-logo.png"
            alt="IETE SPIT Logo"
            class="logo"
        >

        <!-- TAG -->

        <div class="tag">
            IETE SPIT • SUBCOMMITTEE
        </div>

        <!-- TITLE -->

        <h1>
            JOIN IETE
        </h1>

        <!-- DESCRIPTION -->

        <p class="subtitle">
            Explore. Create. Connect.
            Be a part of the IETE SPIT community.
        </p>

        <!-- QUESTION -->

        <div class="question">
            Do you want to fill the form?
        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button id="yesBtn">
                YES
            </button>

            <button id="noBtn">
                NO
            </button>

        </div>

        <!-- FOOTER -->

        <div class="footer">
            INSTITUTION OF ELECTRONICS & TELECOMMUNICATION ENGINEERS
            <br>
            • SPIT •
        </div>

    </div>


    <script>

        /* =========================
           GOOGLE FORM
        ========================= */

        const formURL =
            "https://forms.gle/fS1jgEvnT2bhq68AA";


        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");


        /* =========================
           YES BUTTON
        ========================= */

        yesBtn.addEventListener("click", () => {

            window.open(
                formURL,
                "_blank"
            );

        });


        /* =========================
           NO BUTTON TEXT
        ========================= */

        const noTexts = [
            "NOPE",
            "NAH",
            "NICE TRY",
            "STILL NO",
            "JUST SAY YES",
            "FINE, KEEP TRYING"
        ];


        let noClickCount = 0;


        /* =========================
           NO BUTTON
        ========================= */

        noBtn.addEventListener("click", () => {

            /*
                Increase click count
            */

            noClickCount++;


            /*
                Change text
            */

            if (noClickCount <= noTexts.length) {

                noBtn.textContent =
                    noTexts[noClickCount - 1];

            }


            /*
                Final state
            */

            if (noClickCount === noTexts.length) {

                noBtn.disabled = true;

                noBtn.textContent =
                    "FINE, KEEP TRYING";

            }

        });

    </script>

</body>
</html>
