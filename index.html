<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join IETE SPIT</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(39, 105, 210, 0.28),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(0, 80, 180, 0.18),
                    transparent 30%
                ),
                #03091d;
        }

        /* =========================
           TECHNICAL GRID
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;

            background-image:
                linear-gradient(
                    rgba(70, 150, 255, 0.12) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(70, 150, 255, 0.12) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );
        }

        /* =========================
           MAIN CARD
        ========================= */

        .card {
            position: relative;

            width: min(92%, 650px);

            padding: 42px 35px 48px;

            text-align: center;

            background: rgba(5, 14, 40, 0.84);

            border: 1px solid rgba(
                75,
                160,
                255,
                0.35
            );

            border-radius: 28px;

            box-shadow:
                0 0 60px rgba(
                    0,
                    90,
                    255,
                    0.14
                ),
                inset 0 0 35px rgba(
                    50,
                    130,
                    255,
                    0.04
                );

            backdrop-filter: blur(12px);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 155px;
            height: 155px;

            object-fit: contain;

            display: block;

            margin: 0 auto 20px;

            filter:
                drop-shadow(
                    0 0 12px rgba(
                        35,
                        135,
                        255,
                        0.55
                    )
                )
                drop-shadow(
                    0 0 30px rgba(
                        0,
                        70,
                        255,
                        0.18
                    )
                );
        }

        /* =========================
           TAG
        ========================= */

        .tag {
            display: inline-block;

            margin-bottom: 14px;

            padding: 7px 16px;

            color: #79c7ff;

            border: 1px solid rgba(
                80,
                175,
                255,
                0.45
            );

            border-radius: 999px;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;
        }

        /* =========================
           HEADING
        ========================= */

        h1 {
            font-size: clamp(
                35px,
                7vw,
                62px
            );

            letter-spacing: 5px;

            line-height: 1;

            margin-bottom: 14px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #6bc7ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {
            color: #a9b9d5;

            font-size: 15px;

            line-height: 1.6;

            margin: 0 auto 35px;

            max-width: 470px;
        }

        /* =========================
           QUESTION
        ========================= */

        .question {
            font-size: 21px;

            font-weight: 600;

            margin-bottom: 24px;

            color: #f3f7ff;
        }

        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {
            min-height: 100px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            position: relative;
        }

        /* =========================
           GENERAL BUTTON
        ========================= */

        button {
            width: 145px;

            height: 52px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.25s ease;
        }

        /* =========================
           YES BUTTON
        ========================= */

        #yesBtn {
            color: white;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #1677ff,
                    #45b9ff
                );

            box-shadow:
                0 8px 25px rgba(
                    20,
                    120,
                    255,
                    0.32
                );
        }

        #yesBtn:hover {
            transform:
                translateY(-3px)
                scale(1.03);

            box-shadow:
                0 12px 32px rgba(
                    20,
                    140,
                    255,
                    0.48
                );
        }

        /* =========================
           NO BUTTON
        ========================= */

        #noBtn {
            position: relative;

            color: #d7e2f5;

            background: rgba(
                255,
                255,
                255,
                0.07
            );

            border: 1px solid rgba(
                150,
                190,
                240,
                0.25
            );
        }

        #noBtn:hover {
            background: rgba(
                255,
                255,
                255,
                0.11
            );
        }

        /* =====================================================
           CAPACITOR
        ===================================================== */

        .capacitor {
            position: absolute;

            left: calc(50% + 82px);

            top: -105px;

            width: 70px;
            height: 85px;

            display: none;

            z-index: 100;

            pointer-events: none;
        }

        /* Capacitor body */

        .capacitor-body {
            position: absolute;

            left: 15px;
            top: 12px;

            width: 40px;
            height: 60px;

            border-radius: 8px;

            background:
                linear-gradient(
                    90deg,
                    #071d3d,
                    #168cff,
                    #a9e5ff,
                    #168cff,
                    #071d3d
                );

            border: 3px solid #9ce5ff;

            box-shadow:
                0 0 10px #168cff,
                0 0 25px #168cff,
                inset 0 0 15px #8edcff;

            animation:
                capacitorCharge
                0.8s infinite alternate;
        }

        /* Capacitor plates */

        .capacitor-body::before,
        .capacitor-body::after {
            content: "";

            position: absolute;

            left: -12px;

            width: 58px;
            height: 7px;

            background: #d7f5ff;

            border-radius: 5px;

            box-shadow:
                0 0 8px #fff,
                0 0 20px #28aaff;
        }

        .capacitor-body::before {
            top: 15px;
        }

        .capacitor-body::after {
            bottom: 15px;
        }

        /* + */

        .capacitor::before {
            content: "+";

            position: absolute;

            right: -15px;
            top: 8px;

            color: white;

            font-size: 20px;

            font-weight: bold;

            text-shadow:
                0 0 8px #4fcaff;

            z-index: 5;
        }

        /* - */

        .capacitor::after {
            content: "−";

            position: absolute;

            right: -15px;
            bottom: 8px;

            color: white;

            font-size: 22px;

            font-weight: bold;

            text-shadow:
                0 0 8px #4fcaff;

            z-index: 5;
        }

        /* =========================
           CAPACITOR CHARGING
        ========================= */

        @keyframes capacitorCharge {

            0% {
                filter: brightness(1);

                box-shadow:
                    0 0 8px #168cff,
                    0 0 15px #168cff;
            }

            100% {
                filter: brightness(2);

                box-shadow:
                    0 0 15px #fff,
                    0 0 35px #168cff,
                    0 0 65px #28b8ff;
            }
        }

        /* =====================================================
           EXPLOSION FLASH
        ===================================================== */

        .explosion {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 25px;
            height: 25px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0);

            z-index: 200;
        }

        .explode .explosion {
            animation:
                explosionFlash
                0.65s ease-out
                forwards;
        }

        @keyframes explosionFlash {

            0% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(0);

                box-shadow:
                    0 0 10px white;
            }

            25% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(5);

                box-shadow:
                    0 0 30px white,
                    0 0 70px #4dbfff,
                    0 0 120px #168cff;
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(12);
            }
        }

        /* =====================================================
           EXPLOSION RAYS
        ===================================================== */

        .explosion-ray {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 8px;
            height: 55px;

            border-radius: 10px;

            background:
                linear-gradient(
                    to bottom,
                    white,
                    #52caff,
                    transparent
                );

            transform-origin: 50% 0;

            opacity: 0;

            z-index: 150;
        }

        .explode .explosion-ray {
            animation:
                explosionRay
                0.65s ease-out
                forwards;
        }

        .explosion-ray:nth-child(3) {
            transform: rotate(0deg);
        }

        .explosion-ray:nth-child(4) {
            transform: rotate(45deg);
        }

        .explosion-ray:nth-child(5) {
            transform: rotate(90deg);
        }

        .explosion-ray:nth-child(6) {
            transform: rotate(135deg);
        }

        .explosion-ray:nth-child(7) {
            transform: rotate(180deg);
        }

        .explosion-ray:nth-child(8) {
            transform: rotate(225deg);
        }

        .explosion-ray:nth-child(9) {
            transform: rotate(270deg);
        }

        .explosion-ray:nth-child(10) {
            transform: rotate(315deg);
        }

        @keyframes explosionRay {

            0% {
                opacity: 1;

                height: 15px;
            }

            100% {
                opacity: 0;

                height: 120px;
            }
        }

        /* =====================================================
           ELECTRIC SPARKS
        ===================================================== */

        .spark {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 6px;
            height: 35px;

            background: #b8efff;

            border-radius: 5px;

            box-shadow:
                0 0 8px #fff,
                0 0 20px #1da9ff;

            opacity: 0;

            z-index: 160;
        }

        .explode .spark {
            animation:
                sparkFly
                0.75s ease-out
                forwards;
        }

        .spark:nth-child(11) {
            transform: rotate(20deg);
        }

        .spark:nth-child(12) {
            transform: rotate(65deg);
        }

        .spark:nth-child(13) {
            transform: rotate(110deg);
        }

        .spark:nth-child(14) {
            transform: rotate(155deg);
        }

        .spark:nth-child(15) {
            transform: rotate(200deg);
        }

        .spark:nth-child(16) {
            transform: rotate(245deg);
        }

        .spark:nth-child(17) {
            transform: rotate(290deg);
        }

        .spark:nth-child(18) {
            transform: rotate(335deg);
        }

        @keyframes sparkFly {

            0% {
                opacity: 1;

                height: 15px;
            }

            100% {
                opacity: 0;

                height: 100px;
            }
        }

        /* =====================================================
           CARD SHAKE
        ===================================================== */

        .card.explosion-shake {
            animation:
                screenShake
                0.55s ease;
        }

        @keyframes screenShake {

            0%,
            100% {
                transform:
                    translate(0, 0);
            }

            15% {
                transform:
                    translate(-7px, 4px);
            }

            30% {
                transform:
                    translate(8px, -5px);
            }

            45% {
                transform:
                    translate(-6px, -4px);
            }

            60% {
                transform:
                    translate(6px, 5px);
            }

            75% {
                transform:
                    translate(-3px, 2px);
            }
        }

        /* =====================================================
           DAMAGED NO BUTTON
        ===================================================== */

        #noBtn.damaged {
            animation:
                destroyButton
                0.65s ease
                forwards;

            pointer-events: none;

            cursor: not-allowed;
        }

        @keyframes destroyButton {

            0% {
                transform:
                    scale(1);

                opacity: 1;

                filter: none;
            }

            15% {
                transform:
                    translate(-8px, 2px)
                    rotate(-7deg);
            }

            30% {
                transform:
                    translate(9px, -3px)
                    rotate(8deg);
            }

            45% {
                transform:
                    translate(-8px, 3px)
                    rotate(-6deg);
            }

            60% {
                transform:
                    translate(7px, -2px)
                    rotate(5deg);
            }

            75% {
                transform:
                    scale(0.92)
                    rotate(-3deg);

                opacity: 0.65;
            }

            100% {
                transform:
                    scale(0.75)
                    rotate(0deg);

                opacity: 0.25;

                filter:
                    grayscale(1)
                    brightness(0.5);
            }
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 32px;

            color: #617391;

            font-size: 11px;

            letter-spacing: 1.5px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .card {
                padding:
                    32px
                    20px
                    38px;
            }

            .logo {
                width: 125px;
                height: 125px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                width: 125px;
            }

            .capacitor {
                left: calc(50% + 68px);
            }
        }
    </style>
</head>


<body>

    <!-- =====================================================
         MAIN CARD
    ===================================================== -->

    <main class="card">

        <!-- IETE LOGO -->
        <img
            src="iete-logo.png"
            alt="IETE SPIT Logo"
            class="logo"
        >

        <!-- TAG -->
        <div class="tag">
            IETE SPIT • SUBCOMMITTEE
        </div>

        <!-- TITLE -->
        <h1>
            JOIN IETE
        </h1>

        <!-- DESCRIPTION -->
        <p class="subtitle">
            Explore. Create. Connect.<br>
            Be a part of the IETE SPIT community.
        </p>

        <!-- QUESTION -->
        <div class="question">
            Do you want to fill the form?
        </div>


        <!-- =================================================
             BUTTONS
        ================================================= -->

        <div class="buttons">

            <!-- YES -->
            <button id="yesBtn">
                YES
            </button>


            <!-- NO -->
            <button id="noBtn">
                NO
            </button>


            <!-- =================================================
                 CAPACITOR
            ================================================= -->

            <div
                class="capacitor"
                id="capacitor"
            >

                <!-- Capacitor -->
                <div class="capacitor-body"></div>


                <!-- Main explosion -->
                <div class="explosion"></div>


                <!-- Explosion rays -->

                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>
                <div class="explosion-ray"></div>


                <!-- Sparks -->

                <div class="spark"></div>
                <div class="spark"></div>
                <div class="spark"></div>
                <div class="spark"></div>
                <div class="spark"></div>
                <div class="spark"></div>
                <div class="spark"></div>
                <div class="spark"></div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="footer">
            INSTITUTION OF ELECTRONICS &
            TELECOMMUNICATION ENGINEERS • SPIT
        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =========================
           GET ELEMENTS
        ========================= */

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const capacitor =
            document.getElementById("capacitor");

        const card =
            document.querySelector(".card");


        /* =========================
           GOOGLE FORM
        ========================= */

        const formURL =
            "https://forms.gle/fS1jgEvnT2bhq68AA";


        /* =========================
           YES BUTTON
        ========================= */

        yesBtn.addEventListener(
            "click",
            () => {

                window.open(
                    formURL,
                    "_blank"
                );

            }
        );


        /* =========================
           NO BUTTON
        ========================= */

        noBtn.addEventListener(
            "click",
            () => {

                /* Prevent multiple clicks */

                if (noBtn.disabled) {
                    return;
                }


                /* ---------------------------------
                   STEP 1
                   SHOW CAPACITOR
                --------------------------------- */

                capacitor.style.display =
                    "block";


                /* ---------------------------------
                   STEP 2
                   LET IT CHARGE
                --------------------------------- */

                setTimeout(
                    () => {

                        /* Start explosion */

                        capacitor.classList.add(
                            "explode"
                        );


                        /* Shake card */

                        card.classList.add(
                            "explosion-shake"
                        );


                        /* ---------------------------------
                           STEP 3
                           DESTROY NO BUTTON
                        --------------------------------- */

                        setTimeout(
                            () => {

                                noBtn.classList.add(
                                    "damaged"
                                );

                                noBtn.disabled =
                                    true;

                                noBtn.textContent =
                                    "DAMAGED";

                            },
                            250
                        );

                    },
                    800
                );


                /* ---------------------------------
                   STEP 4
                   CLEAN UP EXPLOSION
                --------------------------------- */

                setTimeout(
                    () => {

                        capacitor.style.display =
                            "none";

                        capacitor.classList.remove(
                            "explode"
                        );

                        card.classList.remove(
                            "explosion-shake"
                        );

                    },
                    1800
                );

            }
        );

    </script>

</body>
</html>
