<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IETE SPIT | Join Us</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #020914;
            color: white;
        }


        /* =========================================
           BACKGROUND VIDEO
        ========================================= */

        .video-background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -10;

            pointer-events: none;

            background: #020914;

            filter:
                brightness(0.62)
                contrast(1.08)
                saturate(1.05);
        }


        /* =========================================
           VIDEO OVERLAY
        ========================================= */

        .video-overlay {
            position: fixed;

            inset: 0;

            z-index: -9;

            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(2, 10, 25, 0.70),
                    rgba(0, 35, 70, 0.35),
                    rgba(2, 8, 20, 0.72)
                );
        }


        /* =========================================
           TECH GRID
        ========================================= */

        .grid {
            position: fixed;

            inset: 0;

            z-index: -8;

            pointer-events: none;

            opacity: 0.18;

            background-image:
                linear-gradient(
                    rgba(0, 170, 255, 0.18) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 170, 255, 0.18) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;
        }


        /* =========================================
           BACKGROUND GLOWS
        ========================================= */

        .glow {
            position: fixed;

            width: 550px;
            height: 550px;

            border-radius: 50%;

            background:
                rgba(0, 145, 255, 0.18);

            filter: blur(130px);

            z-index: -7;

            top: -220px;
            left: -180px;

            pointer-events: none;
        }

        .glow2 {
            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(0, 100, 255, 0.16);

            filter: blur(130px);

            z-index: -7;

            bottom: -220px;
            right: -180px;

            pointer-events: none;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page {
            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 30px;

            position: relative;

            z-index: 1;
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .card {
            width: min(760px, 92vw);

            min-height: 620px;

            padding:
                55px 65px 45px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            position: relative;

            border-radius: 30px;

            background:
                rgba(4, 17, 37, 0.76);

            border:
                1px solid
                rgba(80, 190, 255, 0.38);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.55),

                0 0 70px
                rgba(0, 130, 255, 0.16),

                inset 0 0 50px
                rgba(0, 150, 255, 0.035);

            animation:
                cardAppear 0.8s ease forwards;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           TOP BLUE LINE
        ========================================= */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00b7ff,
                    transparent
                );

            box-shadow:
                0 0 18px
                rgba(0, 180, 255, 0.9);
        }


        /* =========================================
           CORNERS
        ========================================= */

        .corner {
            position: absolute;

            width: 24px;
            height: 24px;

            border-color:
                rgba(100, 210, 255, 0.75);
        }

        .corner.tl {
            top: 16px;
            left: 16px;

            border-top: 2px solid;
            border-left: 2px solid;
        }

        .corner.tr {
            top: 16px;
            right: 16px;

            border-top: 2px solid;
            border-right: 2px solid;
        }

        .corner.bl {
            bottom: 16px;
            left: 16px;

            border-bottom: 2px solid;
            border-left: 2px solid;
        }

        .corner.br {
            bottom: 16px;
            right: 16px;

            border-bottom: 2px solid;
            border-right: 2px solid;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            width: 145px;
            height: 145px;

            object-fit: contain;

            margin-bottom: 22px;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(0, 190, 255, 0.9)
                )

                drop-shadow(
                    0 0 35px
                    rgba(0, 120, 255, 0.55)
                );

            animation:
                logoFloat 4s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        /* =========================================
           TAG
        ========================================= */

        .tag {
            display: inline-block;

            padding: 9px 18px;

            margin-bottom: 22px;

            border-radius: 50px;

            border:
                1px solid
                rgba(50, 190, 255, 0.4);

            background:
                rgba(0, 130, 255, 0.10);

            color: #69ceff;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;
        }


        /* =========================================
           MAIN TITLE
        ========================================= */

        h1 {
            font-size:
                clamp(60px, 8vw, 90px);

            font-weight: 900;

            letter-spacing: 6px;

            line-height: 1;

            margin-bottom: 22px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #65ccff,
                    #ffffff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(0, 160, 255, 0.25)
                );
        }


        /* =========================================
           SUBTITLE
        ========================================= */

        .subtitle {
            max-width: 580px;

            color:
                rgba(220, 235, 250, 0.82);

            font-size: 17px;

            line-height: 1.8;

            margin-bottom: 30px;
        }


        /* =========================================
           DIVIDER
        ========================================= */

        .divider {
            width: 100px;

            height: 2px;

            margin-bottom: 30px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00baff,
                    transparent
                );

            box-shadow:
                0 0 15px
                rgba(0, 180, 255, 0.8);
        }


        /* =========================================
           QUESTION
        ========================================= */

        .question {
            font-size: 22px;

            font-weight: 700;

            color: #f1f8ff;

            margin-bottom: 27px;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;
        }

        button {
            width: 165px;
            height: 56px;

            border-radius: 14px;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                all 0.25s ease;
        }


        /* =========================================
           YES BUTTON
        ========================================= */

        #yesBtn {
            color: white;

            border:
                1px solid
                rgba(0, 0, 0, 0.75);

            background:
               color: #d2dfef;

            background:
                rgba(255, 255, 255, 0.065);

            border:
                1px solid
                rgba(180, 215, 245, 0.25);
        }




        /* =========================================
           NO BUTTON
        ========================================= */

        #noBtn {
            color: #d2dfef;

            background:
                rgba(255, 255, 255, 0.065);

            border:
                1px solid
                rgba(180, 215, 245, 0.25);
        }

        #noBtn:hover {
            background:
                rgba(255, 255, 255, 0.11);

            transform:
                translateY(-3px);
        }


        /* =========================================
           DISABLED NO BUTTON
        ========================================= */

        #noBtn:disabled {
            cursor: not-allowed;

            opacity: 0.42;

            background:
                rgba(255, 255, 255, 0.035);

            transform: none;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            margin-top: 35px;

            color:
                rgba(145, 170, 200, 0.68);

            font-size: 10px;

            letter-spacing: 2px;

            line-height: 1.8;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .page {
                min-height: 100vh;

                height: auto;

                padding: 20px 12px;
            }

            .card {
                width: 94vw;

                min-height: auto;

                padding:
                    35px 20px 30px;
            }

            .logo {
                width: 105px;
                height: 105px;

                margin-bottom: 17px;
            }

            .tag {
                font-size: 9px;

                letter-spacing: 2px;

                padding:
                    7px 12px;
            }

            h1 {
                font-size: 52px;

                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 14px;

                line-height: 1.7;
            }

            .question {
                font-size: 17px;
            }

            button {
                width: 135px;

                height: 50px;

                font-size: 13px;
            }

            .footer {
                font-size: 7px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND VIDEO
    ========================================== -->

    <video
        id="backgroundVideo"
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablePictureInPicture
    >

        <source
            src="video.mp4"
            type="video/mp4"
        >

    </video>


    <!-- VIDEO OVERLAY -->

    <div class="video-overlay"></div>


    <!-- TECH GRID -->

    <div class="grid"></div>


    <!-- BACKGROUND GLOWS -->

    <div class="glow"></div>

    <div class="glow2"></div>


    <!-- =========================================
         MAIN PAGE
    ========================================== -->

    <main class="page">

        <section class="card">


            <!-- CORNERS -->

            <div class="corner tl"></div>

            <div class="corner tr"></div>

            <div class="corner bl"></div>

            <div class="corner br"></div>


            <!-- LOGO -->

            <img
                src="iete-logo.png"
                alt="IETE SPIT Logo"
                class="logo"
            >


            <!-- TAG -->

            <div class="tag">

                IETE SPIT
                •
                SUBCOMMITTEE

            </div>


            <!-- TITLE -->

            <h1>
                JOIN IETE
            </h1>


            <!-- DESCRIPTION -->

            <p class="subtitle">

                Explore. Create. Connect.

                <br>

                Be a part of the IETE SPIT community
                and build something that matters.

            </p>


            <!-- DIVIDER -->

            <div class="divider"></div>


            <!-- QUESTION -->

            <div class="question">

                Do you want to fill the form?

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button id="yesBtn" disabled>
                    Too late :(
                </button>

                <button id="noBtn">
                    NO
                </button>

            </div>


            <!-- FOOTER -->

            <div class="footer">

                INSTITUTION OF ELECTRONICS &
                TELECOMMUNICATION ENGINEERS

                <br>

                • SPIT •

            </div>


        </section>

    </main>


    <script>

        /* =========================================
           GOOGLE FORM
        ========================================== */

        const formURL =
            "https://forms.gle/fS1jgEvnT2bhq68AA";


        const yesBtn =
            document.getElementById("yesBtn");


        const noBtn =
            document.getElementById("noBtn");


        /* =========================================
           YES BUTTON
        ========================================== */

        yesBtn.addEventListener(
            "click",
            function () {

                window.open(
                    formURL,
                    "_blank"
                );

            }
        );


        /* =========================================
           NO BUTTON
        ========================================== */

        const noTexts = [

            "NOPE",

            "NAH",

            "NICE TRY",

            "STILL NO",

            "JUST SAY YES",

            "FINE, KEEP TRYING"

        ];


        let noClickCount = 0;


        noBtn.addEventListener(
            "click",
            function () {

                noClickCount++;


                /*
                    Change text.
                */

                noBtn.textContent =
                    noTexts[
                        noClickCount - 1
                    ];


                /*
                    Disable after
                    final message.
                */

                if (
                    noClickCount >=
                    noTexts.length
                ) {

                    noBtn.disabled = true;

                }

            }
        );


        /* =========================================
           BACKGROUND VIDEO
        ========================================== */

        const video =
            document.getElementById(
                "backgroundVideo"
            );


        /*
            Make absolutely sure
            autoplay is muted.
        */

        video.muted = true;

        video.defaultMuted = true;

        video.loop = true;


        /*
            Initial playback.
        */

        function startVideo() {

            if (
                video.paused &&
                document.visibilityState === "visible"
            ) {

                video.play().catch(
                    function () {
                        // Browser will retry later.
                    }
                );

            }

        }


        /*
            Start after page loads.
        */

        window.addEventListener(
            "load",
            function () {

                startVideo();

            }
        );


        /*
            If the browser pauses the
            video while the page is visible,
            resume it.

            IMPORTANT:
            We do NOT reset currentTime.
        */

        video.addEventListener(
            "pause",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    setTimeout(
                        startVideo,
                        300
                    );

                }

            }
        );


        /*
            When the video finishes,
            loop it manually as an extra
            safety measure.
        */

        video.addEventListener(
            "ended",
            function () {

                video.currentTime = 0;

                startVideo();

            }
        );


        /*
            When the user comes back
            to the tab.
        */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    startVideo();

                }

            }
        );


        /*
            Extra safety check.

            Every 3 seconds we check whether
            the video has unexpectedly stopped.

            It does NOT restart the video
            from the beginning.
        */

        setInterval(
            function () {

                if (
                    document.visibilityState ===
                    "visible" &&
                    video.paused
                ) {

                    startVideo();

                }

            },
            3000
        );

    </script>

</body>

</html>
